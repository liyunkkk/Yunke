name: Yunke Build

on:
  push:
    branches:
      - main
      - "feat/*"
      - "sync-*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apks:
    name: 构建 APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: 配置 JDK 25
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "25"

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          cache-provider: basic

      - name: 配置 Android SDK
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [[ ! -d "$sdk_root" ]]; then
            echo "::error::未找到 Android SDK 目录: $sdk_root"
            exit 1
          fi
          sdkmanager="$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [[ -z "$sdkmanager" ]]; then
            echo "::error::未找到 sdkmanager"
            exit 1
          fi
          echo "$(dirname "$sdkmanager")" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          yes | "$sdkmanager" --licenses >/dev/null || true

      - name: 安装 Android SDK 37
        run: sdkmanager --channel=3 "platforms;android-37.0"

      - name: 生成临时签名证书
        run: |
          set -euo pipefail
          temporary_store="$RUNNER_TEMP/yunke-release.jks"
          temporary_password="yunke-temporary"
          temporary_alias="yunke"
          keytool -genkeypair \
            -keystore "$temporary_store" \
            -storetype JKS \
            -storepass "$temporary_password" \
            -keypass "$temporary_password" \
            -alias "$temporary_alias" \
            -keyalg RSA \
            -keysize 3072 \
            -validity 3650 \
            -dname "CN=Yunke Temporary Build,OU=GitHub Actions,O=Yunke,C=CN" \
            -noprompt
          {
            echo "ETA_RELEASE_STORE_FILE=$temporary_store"
            echo "ETA_RELEASE_STORE_PASSWORD=$temporary_password"
            echo "ETA_RELEASE_KEY_ALIAS=$temporary_alias"
            echo "ETA_RELEASE_KEY_PASSWORD=$temporary_password"
          } >> "$GITHUB_ENV"

      - name: 运行单元测试
        timeout-minutes: 20
        run: >-
          ./gradlew --no-daemon --no-configuration-cache
          :app:testDebugUnitTest

      - name: 上传单测报告
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unit-test-reports
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 7

      - name: 构建 Release APK
        env:
          ETA_RELEASE_STORE_FILE: ${{ env.ETA_RELEASE_STORE_FILE }}
          ETA_RELEASE_STORE_PASSWORD: ${{ env.ETA_RELEASE_STORE_PASSWORD }}
          ETA_RELEASE_KEY_ALIAS: ${{ env.ETA_RELEASE_KEY_ALIAS }}
          ETA_RELEASE_KEY_PASSWORD: ${{ env.ETA_RELEASE_KEY_PASSWORD }}
        run: >-
          ./gradlew --no-daemon --no-configuration-cache
          :app:assembleRelease

      - name: 上传 APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: yunke-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
