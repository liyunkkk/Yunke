name: Eta Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 与打包并行且不接触签名 Secrets；失败不影响 APK 上传，但会阻止发版草稿
  verify:
    name: Lint 与单元测试
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: 配置构建环境
        uses: ./.github/actions/setup-build

      - name: Lint 与单元测试
        run: >-
          ./gradlew --no-daemon --no-configuration-cache --continue
          :app:lintDebug :app:testDebugUnitTest

      - name: 上传检查报告
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: verify-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

  build-apks:
    name: 构建 Debug 与 Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: 配置构建环境
        uses: ./.github/actions/setup-build

      - name: 生成临时签名证书
        run: |
          set -euo pipefail
          store="$RUNNER_TEMP/eta-coexist.jks"
          pass="eta-coexist-temporary"
          keytool -genkeypair             -keystore "$store" -storetype JKS             -storepass "$pass" -keypass "$pass" -alias eta             -keyalg RSA -keysize 3072 -validity 3650             -dname "CN=Eta Coexist,OU=CI,O=Eta,C=CN" -noprompt
          {
            echo "ETA_RELEASE_STORE_FILE=$store"
            echo "ETA_RELEASE_STORE_PASSWORD=$pass"
            echo "ETA_RELEASE_KEY_ALIAS=eta"
            echo "ETA_RELEASE_KEY_PASSWORD=$pass"
          } >> "$GITHUB_ENV"

      - name: 构建 Debug 与 Release APK
        # 发版标签保持纯净版本名；其余构建追加 +<短提交号>，与已发布版本区分
